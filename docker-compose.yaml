services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: mangette-flaresolverr
    environment:
      - LOG_LEVEL=info
      - HOST=0.0.0.0
    ports:
      # Same machine: 127.0.0.1. Debian VM that Windows talks to: FLARESOLVERR_BIND=0.0.0.0
      - "${FLARESOLVERR_BIND:-127.0.0.1}:8191:8191"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
