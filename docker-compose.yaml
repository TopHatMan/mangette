# FlareSolverr on the Debian VM so Windows Mangette can use
# http://192.168.1.210:8191
#
# Host networking (Linux only) binds 8191 on the VM itself. Docker port-publish
# often fails inside VirtualBox even with ufw off.
#
#   docker compose up -d
#   curl -sS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8191/
#
# VirtualBox: Bridged adapter so 192.168.1.210 is on the LAN.
# NAT-only: add a TCP 8191 -> 8191 port forward.
services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: mangette-flaresolverr
    network_mode: host
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - HOST=0.0.0.0
      - PORT=${FLARESOLVERR_PORT:-8191}
      - TZ=${TZ:-UTC}
    shm_size: "2gb"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
