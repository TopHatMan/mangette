services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: mangette-flaresolverr
    environment:
      - LOG_LEVEL=info
      - HOST=0.0.0.0
    ports:
      - "127.0.0.1:8191:8191"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
