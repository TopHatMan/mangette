name: Bug Report
description: File a bug report
title: "[Mangette broke]: <title>"
labels: ["bug"]
body:
- type: textarea
  attributes:
    label: What is broken?
    description: What happened? How did we get here?
    placeholder: Tell me what you expected to happen, and what happened instead.
  validations:
    required: true
- type: textarea
  attributes: 
    label: Log-output
    description: Console output from Mangette, or `docker logs mangette`
    render: console
- type: textarea
  attributes:
    label: Mangette version
    description: Startup log should start with `Mangette` and include branch/commit. Paste that banner here.
    render: console
- type: textarea
  attributes: 
    label: Additional stuff
    description: Screenshots, anything you think might help